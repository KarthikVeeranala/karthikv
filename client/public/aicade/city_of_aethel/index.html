<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City of Aethel — Karthik Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f1013;
      color: #f4f4f6;
      font-family: 'DM Sans', -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #splash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, #1c1d24 0%, #0c0d10 85%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 13px;
      background: rgba(217, 119, 54, 0.12);
      border: 1px solid rgba(217, 119, 54, 0.35);
      border-radius: 999px;
      color: #e5a93c;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Averia Serif Libre', Georgia, serif;
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 700;
      color: #fcfbfa;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    p.tagline {
      font-size: 16px;
      color: #9da1ad;
      max-width: 620px;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .subtext-note {
      font-size: 14px;
      color: #e5a93c;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: #f5f5f7;
      color: #121316;
    }
    .btn-primary:hover {
      background: #ffffff;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #1f2128;
      color: #e5a93c;
      border: 1px solid rgba(229, 169, 60, 0.35);
    }
    .btn-secondary:hover {
      background: #282a34;
      border-color: rgba(229, 169, 60, 0.7);
      transform: translateY(-2px);
    }
    .key-hints {
      margin-top: 36px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      font-size: 12px;
      color: #6c707d;
    }
    .keycap {
      background: #1c1d24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 2px 7px;
      font-family: 'Geist Mono', monospace;
      color: #c9ccd5;
    }
    #game-container {
      display: none;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #game-frame {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <!-- Editorial Launcher Splash -->
  <div id="splash">
    <div class="badge-pill">
      <span>IGDC 2024 Top 45 Indie Finalist</span>
    </div>
    <h1>City of Aethel</h1>
    <p class="tagline">
      A 2D narrative action RPG featuring custom dungeon architecture, reactive melee combo chains, and a multi-phase boss encounter.
    </p>
    <div class="subtext-note">
      Combat mechanics and dungeon encounter systems by Karthik
    </div>
    <div class="actions">
      <button id="btn-play-game" class="btn btn-primary">
        <span>Play Now</span>
        <span>&rarr;</span>
      </button>
    </div>
    <div class="key-hints">
      <span><span class="keycap">W A S D</span> Move</span>
      <span><span class="keycap">SPACE</span> Jump</span>
      <span><span class="keycap">L-CLICK</span> Attack Combo</span>
      <span><span class="keycap">CTRL</span> Roll</span>
      <span><span class="keycap">E</span> Block</span>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <div id="game-frame"></div>
  </div>

  <!-- Local Offline Runtime & Phaser (with fallback) -->
  <script src="../shared/phaser.min.js"></script>
  <script>
    if (typeof Phaser === 'undefined') {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"><\/script>');
    }
  </script>
  <script src="../shared/aicade-runtime.js"></script>

  <script>
    function launchGame() {
      const splash = document.getElementById("splash");
      if (splash) splash.style.display = "none";
      const container = document.getElementById("game-container");
      if (container) container.style.display = "flex";

      fetch("config.json")
        .then(res => res.json())
        .then(configJSON => {
          window._CONFIG = configJSON;
          const script = document.createElement("script");
          script.src = "game.js";
          script.onload = () => {
            if (typeof Phaser !== "undefined" && typeof config !== "undefined") {
              config.parent = "game-frame";
              window.game = new Phaser.Game(config);
            } else {
              console.error("Config or Phaser not defined.");
            }
          };
          document.body.appendChild(script);
        })
        .catch(err => console.error("Failed to load game config:", err));
    }

    const btnPlay = document.getElementById("btn-play-game");
    if (btnPlay) {
      btnPlay.addEventListener("click", launchGame);
    }

    // Launch game directly into Phaser MenuScene
    launchGame();
  </script>
</body>
</html>
