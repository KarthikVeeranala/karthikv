<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192233"/>
      <stop offset="100%" stop-color="#0f1523"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f857a6"/>
      <stop offset="100%" stop-color="#ff5858"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#43e97b"/>
      <stop offset="100%" stop-color="#38f9d7"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="400" y1="0" x2="400" y2="700"/>
    <line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="800" y1="0" x2="800" y2="700"/>
    <line x1="1000" y1="0" x2="1000" y2="700"/>
  </g>

  <!-- Header Banner -->
  <text x="600" y="55" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="2">UNREAL ENGINE 5.7 END-TO-END AUTOMATION SUITE</text>
  <text x="600" y="85" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#64748b" letter-spacing="1">ARCHITECTURAL SYSTEM OVERVIEW &amp; SUBSYSTEM DATA PIPELINE</text>

  <!-- Top Level Orchestrator Card -->
  <g filter="url(#shadow)">
    <rect x="100" y="115" width="1000" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="100" y="115" width="1000" height="4" fill="url(#accentCyan)"/>
    <text x="130" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" fill="#38bdf8">HEADLESS AUTOMATION COMMANDLET &amp; RUNTIME ORCHESTRATION</text>
    <text x="130" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94a3b8">Executes via <tspan fill="#38f9d7">UC3_E2EAutomationCommandlet</tspan> | Non-blocking FTSTicker (0.5s cadence) | 90s State Guard Timeouts | Multi-Instance CI/CD Pipeline</text>
    <circle cx="1040" cy="160" r="18" fill="#0284c7" opacity="0.3"/>
    <circle cx="1040" cy="160" r="8" fill="#38bdf8"/>
  </g>

  <!-- Connector Lines from Orchestrator down to 3 Subsystems -->
  <path d="M 280 205 L 280 260" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 600 205 L 600 260" stroke="#00f2fe" stroke-width="2"/>
  <path d="M 920 205 L 920 260" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Subsystem Card 1: Win32 Desktop Isolation & Input -->
  <g filter="url(#shadow)">
    <rect x="80" y="260" width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="80" y="260" width="320" height="4" fill="url(#accentAmber)"/>
    <text x="100" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#fbbf24">1. Win32 Desktop Isolation</text>
    <text x="100" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">E2E_IsolatedDesktop Sandbox</text>
    <text x="100" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Spawns under winsta0\E2E_Desk</text>
    <text x="100" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Zero OS focus stealing or jitter</text>
    <text x="100" y="392" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Hardware mouse &amp; key simulation</text>
    <text x="100" y="414" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Low-level keyboard hook safety abort</text>
    <rect x="100" y="440" width="280" height="28" rx="6" fill="#1e293b"/>
    <text x="240" y="459" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#fcd34d">SetThreadDesktop() / Abort Hook</text>
  </g>

  <!-- Subsystem Card 2: Slate & UMG Auto-Discovery -->
  <g filter="url(#shadow)">
    <rect x="440" y="260" width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="440" y="260" width="320" height="4" fill="url(#accentCyan)"/>
    <text x="460" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">2. Slate &amp; UMG Automation</text>
    <text x="460" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Dynamic Hierarchy Traversal</text>
    <text x="460" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Recursive SWidget auto-discovery</text>
    <text x="460" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Tag &amp; programmatic button triggers</text>
    <text x="460" y="392" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• SlateApplication event synthesis</text>
    <text x="460" y="414" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Cross-resolution geometry mapping</text>
    <rect x="460" y="440" width="280" height="28" rx="6" fill="#1e293b"/>
    <text x="600" y="459" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#38bdf8">FSlateApplication::ProcessEvent()</text>
  </g>

  <!-- Subsystem Card 3: GPU Backbuffer & FFmpeg Recording -->
  <g filter="url(#shadow)">
    <rect x="800" y="260" width="320" height="230" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="800" y="260" width="320" height="4" fill="url(#accentPurple)"/>
    <text x="820" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f472b6">3. GPU Frame Capture &amp; Video</text>
    <text x="820" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Raw Buffer to Bundled FFmpeg</text>
    <text x="820" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Viewport backbuffer raw RGB read</text>
    <text x="820" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• High-throughput stdin piping</text>
    <text x="820" y="392" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• H.264 MP4 artifact packaging</text>
    <text x="820" y="414" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">• Automated test pass/fail markers</text>
    <rect x="820" y="440" width="280" height="28" rx="6" fill="#1e293b"/>
    <text x="960" y="459" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" fill="#f472b6">FViewport::ReadPixels() -> stdin pipe</text>
  </g>

  <!-- Connector Lines down to Verification Tier -->
  <path d="M 240 490 L 240 540" stroke="#334155" stroke-width="2"/>
  <path d="M 600 490 L 600 540" stroke="#334155" stroke-width="2"/>
  <path d="M 960 490 L 960 540" stroke="#334155" stroke-width="2"/>

  <!-- Bottom Tier: Headless Dedicated Server & Multi-Instance Replication -->
  <g filter="url(#shadow)">
    <rect x="100" y="540" width="1000" height="120" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="100" y="540" width="1000" height="4" fill="url(#accentGreen)"/>
    <text x="130" y="575" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="17" fill="#4ade80">DEDICATED SERVER &amp; MULTI-INSTANCE CLIENT SYNCHRONIZATION VERIFICATION</text>
    <text x="130" y="605" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13" fill="#94a3b8">Validates multi-client authoritative game states, physics reconciliation, networked replication, and UI state consistency.</text>
    <text x="130" y="630" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="12" fill="#64748b">Generates machine-parseable JSON test suites, video recordings with timestamped logs, and zero-defect validation reports.</text>
    
    <!-- Status badges -->
    <rect x="870" y="565" width="100" height="26" rx="13" fill="#14532d"/>
    <text x="920" y="582" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#4ade80">100% CI PASS</text>
    <rect x="980" y="565" width="100" height="26" rx="13" fill="#1e3a5f"/>
    <text x="1030" y="582" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#38bdf8">UE 5.7 NATIVE</text>
  </g>
</svg>
